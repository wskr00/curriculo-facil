<header class="resume-step-header">
  <p class="resume-step-header__brand">Currículo Fácil</p>

  @if (backLink(); as url) {
    <a class="resume-step-header__back" [routerLink]="url">
      <span aria-hidden="true">←</span>
      Voltar
    </a>
  }

  <app-progress-indicator [currentStep]="currentStep()" [totalSteps]="6" />
</header>
