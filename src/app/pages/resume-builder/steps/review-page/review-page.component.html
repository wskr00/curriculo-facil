<div class="step-page review-page">
  <app-resume-step-header [currentStep]="6" backLink="/curriculo/novo/cursos-e-habilidades" />

  <section class="step-page__intro" aria-labelledby="step-title">
    <h1 id="step-title">Confira antes de baixar</h1>
    <p>Leia com calma. Se algo estiver errado, volte e corrija.</p>
  </section>

  <div #pdfContent class="review-page__document">
    <app-resume-preview [resume]="draft.draft()" />
  </div>

  <a class="review-page__edit-link" routerLink="/curriculo/novo/dados-pessoais">
    Editar informações
  </a>

  <app-button type="button" [disabled]="isDownloading()" (click)="downloadPdf()">
    {{ isDownloading() ? 'Preparando PDF…' : 'Baixar currículo em PDF' }}
  </app-button>

  <p class="review-page__status" role="status" aria-live="polite">
    {{ downloadMessage() }}
  </p>
</div>
