@if (!hidden()) {
  <div class="skill-chip-group">
    <fieldset
      #fieldset
      class="skill-chip-group__fieldset"
      [disabled]="disabled()"
      (focusout)="markTouched($event, fieldset)"
    >
      <legend class="skill-chip-group__legend">
        {{ label() }}
        @if (!required()) {
          <span class="skill-chip-group__optional">opcional</span>
        }
      </legend>

      <div class="skill-chip-group__options">
        @for (option of options(); track option.value) {
          <label
            class="skill-chip-group__option"
            [class.skill-chip-group__option--selected]="isSelected(option.value)"
            [class.skill-chip-group__option--invalid]="errorMessage()"
          >
            <input
              #checkboxControl
              class="skill-chip-group__control"
              type="checkbox"
              [name]="name() || controlId()"
              [value]="option.value"
              [checked]="isSelected(option.value)"
              [attr.aria-invalid]="errorMessage() ? 'true' : null"
              [attr.aria-describedby]="describedBy()"
              (change)="toggleOption(option.value, checkboxControl.checked)"
            />
            <span>{{ option.label }}</span>
          </label>
        }
      </div>
    </fieldset>

    @if (hint()) {
      <span class="skill-chip-group__hint" [id]="hintId()">{{ hint() }}</span>
    }

    @if (errorMessage(); as message) {
      <span
        class="skill-chip-group__error"
        [id]="errorId()"
        aria-live="polite"
        aria-atomic="true"
      >
        {{ message }}
      </span>
    }
  </div>
}
