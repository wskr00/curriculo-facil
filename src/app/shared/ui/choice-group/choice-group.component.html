@if (!hidden()) {
  <div class="choice-group">
    <fieldset
      #fieldset
      class="choice-group__fieldset"
      [disabled]="disabled()"
      (focusout)="markTouched($event, fieldset)"
    >
      <legend class="choice-group__legend">
        {{ label() }}
        @if (!required()) {
          <span class="choice-group__optional">opcional</span>
        }
      </legend>

      <div class="choice-group__options">
        @for (option of options(); track option.value) {
          <label
            class="choice-group__option"
            [class.choice-group__option--selected]="value() === option.value"
          >
            <input
              #radioControl
              class="choice-group__control"
              type="radio"
              [name]="name() || controlId()"
              [value]="option.value"
              [checked]="value() === option.value"
              [required]="required()"
              [attr.aria-invalid]="errorMessage() ? 'true' : null"
              [attr.aria-describedby]="describedBy()"
              (change)="value.set(option.value)"
            />
            <span>{{ option.label }}</span>
          </label>
        }
      </div>
    </fieldset>

    @if (hint()) {
      <span class="choice-group__hint" [id]="hintId()">{{ hint() }}</span>
    }

    @if (errorMessage(); as message) {
      <span
        class="choice-group__error"
        [id]="errorId()"
        aria-live="polite"
        aria-atomic="true"
      >
        {{ message }}
      </span>
    }
  </div>
}
