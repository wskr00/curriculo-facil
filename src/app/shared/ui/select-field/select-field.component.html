@if (!hidden()) {
  <div class="select-field">
    <div class="select-field__label-row">
      <label [for]="controlId()">{{ label() }}</label>
      @if (!required()) {
        <span class="select-field__optional">opcional</span>
      }
    </div>

    <div class="select-field__control-wrapper">
      <select
        #control
        class="select-field__control"
        [class.select-field__control--placeholder]="!value()"
        [id]="controlId()"
        [name]="name()"
        [value]="value()"
        [required]="required()"
        [disabled]="disabled()"
        [attr.aria-invalid]="errorMessage() ? 'true' : null"
        [attr.aria-describedby]="describedBy()"
        (change)="value.set(control.value)"
        (blur)="touch.emit()"
      >
        <option value="">{{ placeholder() }}</option>
        @for (option of options(); track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>

      <svg
        class="select-field__indicator"
        aria-hidden="true"
        focusable="false"
        viewBox="0 0 24 24"
      >
        <path d="m6 9 6 6 6-6" />
      </svg>
    </div>

    @if (hint()) {
      <span class="select-field__hint" [id]="hintId()">{{ hint() }}</span>
    }

    @if (errorMessage(); as message) {
      <span
        class="select-field__error"
        [id]="errorId()"
        aria-live="polite"
        aria-atomic="true"
      >
        {{ message }}
      </span>
    }
  </div>
}
