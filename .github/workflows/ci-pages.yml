name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --watch=false

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run e2e

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build for GitHub Pages
        run: npm run build -- --base-href="${PAGES_BASE_PATH}/"
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Add Angular route fallback for GitHub Pages
        run: cp dist/curriculo-facil/browser/index.html dist/curriculo-facil/browser/404.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/curriculo-facil/browser

  deploy:
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
